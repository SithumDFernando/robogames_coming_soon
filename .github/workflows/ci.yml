name: CI Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-validate:
    name: Build & Static Export Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Next.js static export build
        run: npm run build

      - name: Verify static build artifacts
        run: |
          if [ ! -f out/index.html ]; then
            echo "Error: out/index.html does not exist!"
            exit 1
          fi
          if [ ! -f out/robots.txt ]; then
            echo "Error: out/robots.txt does not exist!"
            exit 1
          fi
          echo "Static export artifacts verified successfully."
